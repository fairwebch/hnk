<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
  <div style="background:#070E1D;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font:500 12px 'Barlow',sans-serif;color:#7E89A3;letter-spacing:.02em">
    <div style="display:flex;gap:18px;align-items:center"><span>+41 79 279 72 32</span><span style="color:#33415F">•</span><span>info@kroatien-schwyz.ch</span></div>
    <div style="display:flex;gap:18px"><span style="cursor:pointer" style-hover="color:#FFFFFF">Facebook</span><span style="cursor:pointer" style-hover="color:#FFFFFF">Instagram</span><span style="cursor:pointer" style-hover="color:#FFFFFF">WhatsApp</span></div>
  </div>
  <div style="background:#0D1B33;height:84px;display:flex;align-items:center;padding:0 40px;gap:28px">
    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <img src="assets/logo.svg" alt="HNK Kroatien Schwyz" style="width:48px;height:48px;display:block">
      <div>
        <div style="font:italic 800 19px/1 'Barlow Condensed',sans-serif;color:#FFFFFF;letter-spacing:.03em">HNK KROATIEN</div>
        <div style="font:700 10px/1 'Barlow Condensed',sans-serif;color:#7E89A3;letter-spacing:.32em;margin-top:3px">SCHWYZ · 1995</div>
      </div>
    </div>
    <div style="display:flex;height:84px">
      <sc-for list="{{ nav }}" as="it" hint-placeholder-count="8">
        <div style="display:flex;align-items:center;height:84px;padding:0 11px;border-bottom:3px solid {{ it.bar }};border-top:3px solid transparent;font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:{{ it.c }};cursor:pointer;white-space:nowrap" style-hover="color:#FFFFFF">{{ it.label }}</div>
      </sc-for>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:16px;flex-shrink:0">
      <div style="display:flex;border:1px solid #2C3D60;border-radius:999px;padding:3px;font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.1em">
        <div style="padding:5px 13px;border-radius:999px;background:{{ hrBg }};color:{{ hrC }};cursor:pointer">HR</div>
        <div style="padding:5px 13px;border-radius:999px;background:{{ deBg }};color:{{ deC }};cursor:pointer">DE</div>
      </div>
      <div style="background:#D8232F;transform:skewX(-8deg);padding:12px 20px;cursor:pointer;box-shadow:0 8px 20px rgba(216,35,47,.3)" style-hover="background:#B4121E">
        <div style="transform:skewX(8deg);font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:.12em;color:#FFFFFF;text-transform:uppercase;white-space:nowrap">{{ join }}</div>
      </div>
    </div>
  </div>
</sc-if>
<sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
  <div style="background:#0D1B33;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="assets/logo.svg" alt="HNK Kroatien Schwyz" style="width:38px;height:38px;display:block">
      <div>
        <div style="font:italic 800 15px/1 'Barlow Condensed',sans-serif;color:#FFFFFF;letter-spacing:.03em">HNK KROATIEN</div>
        <div style="font:700 8px/1 'Barlow Condensed',sans-serif;color:#7E89A3;letter-spacing:.3em;margin-top:2px">SCHWYZ · 1995</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="display:flex;border:1px solid #2C3D60;border-radius:999px;padding:2px;font:700 10px 'Barlow Condensed',sans-serif;letter-spacing:.08em">
        <div style="padding:4px 9px;border-radius:999px;background:{{ hrBg }};color:{{ hrC }}">HR</div>
        <div style="padding:4px 9px;border-radius:999px;background:{{ deBg }};color:{{ deC }}">DE</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;padding:6px 2px">
        <span style="width:20px;height:2px;background:#FFFFFF;display:block"></span>
        <span style="width:20px;height:2px;background:#FFFFFF;display:block"></span>
        <span style="width:14px;height:2px;background:#D8232F;display:block"></span>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pocetna&quot;,&quot;klub&quot;,&quot;momcadi&quot;,&quot;novosti&quot;,&quot;galerija&quot;,&quot;dogadjaji&quot;,&quot;sponzoring&quot;,&quot;kontakt&quot;],&quot;default&quot;:&quot;pocetna&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;hr&quot;,&quot;de&quot;],&quot;default&quot;:&quot;hr&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const lang = this.props.lang ?? 'hr';
    const dict = {
      hr: { items: [['pocetna','Početna'],['klub','Klub'],['momcadi','Momčadi'],['novosti','Novosti'],['galerija','Galerija'],['dogadjaji','Događaji'],['sponzoring','Sponzoring'],['kontakt','Kontakt']], join: 'Učlani se' },
      de: { items: [['pocetna','Startseite'],['klub','Verein'],['momcadi','Mannschaften'],['novosti','News'],['galerija','Galerie'],['dogadjaji','Events'],['sponzoring','Sponsoring'],['kontakt','Kontakt']], join: 'Mitglied werden' }
    }[lang];
    const active = this.props.active ?? 'pocetna';
    const mobile = this.props.mobile ?? false;
    return {
      desktop: !mobile, mobile,
      nav: dict.items.map(([k, label]) => ({ label, c: k === active ? '#FFFFFF' : '#C3CBDC', bar: k === active ? '#D8232F' : 'transparent' })),
      join: dict.join,
      hrBg: lang === 'hr' ? '#FFFFFF' : 'transparent', hrC: lang === 'hr' ? '#0D1B33' : '#8A94AC',
      deBg: lang === 'de' ? '#FFFFFF' : 'transparent', deC: lang === 'de' ? '#0D1B33' : '#8A94AC'
    };
  }
}
</script>
</body>
</html>
